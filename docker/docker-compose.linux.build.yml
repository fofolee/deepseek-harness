version: '3.8'

services:
  build-linux-amd64:
    build:
      context: ..
      dockerfile: docker/Dockerfile.linux.build
      args:
        TARGETARCH: amd64
    image: dsh-linux-builder:amd64
    platform: linux/amd64
    volumes:
      - ..:/workspace
      - /workspace/node_modules

  build-linux-arm64:
    build:
      context: ..
      dockerfile: docker/Dockerfile.linux.build
      args:
        TARGETARCH: arm64
    image: dsh-linux-builder:arm64
    platform: linux/arm64
    volumes:
      - ..:/workspace
      - /workspace/node_modules
